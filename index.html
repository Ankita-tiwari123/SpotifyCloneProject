<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <ul>
        <li class="brand">
            <img src="unnamed.png" alt="Spotify">
            <span>Spotify</span>
        </li>
        <li>Home</li>
        <li>About</li>
    </ul>
</nav>

<div class="container">
    <div class="songList">
        <h1>Best of NCS</h1>

        <div class="songItem">
            <img src="cover.jpg" alt="song">
            <span>Agar Tum Saath Ho</span>
            <span class="timeStamp">
                05:30 <i class="fa-solid fa-play-circle songItemPlay"></i>
            </span>
        </div>

        <div class="songItem">
            <img src="cover.jpg" alt="song">
            <span>Kesariya</span>
            <span class="timeStamp">
                04:20 <i class="fa-solid fa-play-circle songItemPlay"></i>
            </span>
        </div>

        <div class="songItem">
            <img src="cover.jpg" alt="song">
            <span>Tum Hi Ho</span>
            <span class="timeStamp">
                04:40 <i class="fa-solid fa-play-circle songItemPlay"></i>
            </span>
        </div>

    </div>
</div>

<div class="bottom">
    <input type="range" id="myProgressBar" min="0" max="100">

    <div class="icons">
        <i class="fa-solid fa-backward-step" id="previous"></i>
        <i class="fa-solid fa-play-circle" id="masterPlay"></i>
        <i class="fa-solid fa-forward-step" id="next"></i>
    </div>

    <div class="songInfo">
        <img src="gif.png" alt="playing">
        <span id="songName">Agar Tum Saath Ho</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
